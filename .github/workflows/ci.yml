name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        # Formatting is mechanical, so a diff here is always an oversight.
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      # read_pdf rasterizes through Poppler; without it the PDF example skips
      # and stops covering the path it exists to cover.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: go vet ./...
      - run: go build ./...
      # Live tests reach a model server and skip unless STRAP_LIVE_BASE_URL is
      # set, so the suite is self-contained here.
      - run: go test -race -timeout 20m ./...

  container-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixed workspace, file tools, gopls, outbox and hidden grading
        run: docker build -f eval/Dockerfile --target smoke -t strap-eval-smoke .
