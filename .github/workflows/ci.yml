name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        # Formatting is mechanical, so a diff here is always an oversight.
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      # read_pdf rasterizes through Poppler; without it the PDF example skips
      # and stops covering the path it exists to cover.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: go vet ./...
      - run: go build ./...
      # Live tests reach a model server and skip unless STRAP_LIVE_BASE_URL is
      # set, so the suite is self-contained here.
      - run: go test -race -timeout 20m ./...

  language-servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go install golang.org/x/tools/gopls@v0.20.0
      - run: npm install --global typescript-language-server@5.3.0 typescript@5.9.3 pyright@1.1.414 bash-language-server@5.7.1
      - run: rustup toolchain install 1.95.0 --profile minimal --component rust-src --component rust-analyzer
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Real Go, Rust, Python, JavaScript, TypeScript and Bash language servers
        env:
          STRAP_LSP_REAL: '1'
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: go test -race -timeout 5m ./lsp -run TestRealLanguageServers -count=1 -v

  container-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixed workspace, file tools, gopls, outbox and hidden grading
        run: docker build -f eval/Dockerfile --target smoke -t strap-eval-smoke .
